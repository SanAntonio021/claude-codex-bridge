name: Preview Release Artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm.cmd ci
      - run: npm.cmd test
      - run: node --test plugins/claude-codex-bridge/skills/cross-model-orchestration/test/public-skill.test.mjs
      - run: node --test plugins/claude-codex-bridge/skills/cross-model-orchestration/tests/orchestration-control.test.mjs
      - run: npm.cmd run package:release
      - uses: actions/upload-artifact@v4
        with:
          name: claude-codex-bridge-preview
          path: artifacts/
          if-no-files-found: error
